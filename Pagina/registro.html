<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta - RolForge</title>

    <link rel="stylesheet" href="../Api/global.css">
</head>

<body>

    <main class="contenedor-auth">

        <section class="pergamino">

            <!-- ROLLO SUPERIOR -->
            <img
                src="img/pergamino.png"
                class="borde-pergamino borde-arriba"
                alt=""
            >

            <!-- CONTENIDO -->
            <div class="contenido-pergamino">

                <div class="titulo-rollo">
                    <h1>CREAR CUENTA</h1>
                </div>

                <div class="decoracion">
                </div>

                <div class="separador"></div>


                <!-- FORMULARIO DE REGISTRO -->
                <form action="../Api/registro.php" method="POST">

                    <div class="campo">

                        <label for="usuario">
                            Nombre de usuario
                        </label>

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="email">
                            Correo
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="confirmar">
                            Confirmar contraseña
                        </label>

                        <input
                            type="password"
                            id="confirmar"
                            name="confirmar"
                            required
                        >

                    </div>


                    <button type="submit">
                        ⚔ Crear cuenta
                    </button>

                </form>


                <div class="separador"></div>


                <!-- INICIAR SESIÓN -->
                <p class="enlace-login">

                    ¿Ya tienes cuenta?

                    <a href="login.html">
                        Iniciar sesión
                    </a>

                </p>

            </div>


            <!-- ROLLO INFERIOR -->
            <img
                src="img/pergamino.png"
                class="borde-pergamino borde-abajo"
                alt=""
            >

        </section>

    </main>

</body>

</html>
